stion:first-child{padding-top:0}.question h3{font-size:17px;margin:0 0 7px}.question p{font-size:14px;margin:0 0 14px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{font-size:14px;flex:1;padding:11px 8px}.choices button.selected[data-value="OK"]{background:#e0f0e5;border-color:#328154}.choices button.selected[data-value="Problema"]{background:#fff0d9;border-color:#c38021}.choices button.selected[data-value="Não verifiquei"]{background:#e9eceb;border-color:#708077}.details{background:#fff8ec;padding:16px;border-radius:12px;margin-top:16px}.details label:last-child{margin-bottom:0}.footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid #dce2db;padding:16px 20px;backdrop-filter:blur(10px)}.footer>div{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px}.footer span{align-self:center;color:#65746b;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;background:#e6eee7;color:#326042}.amber{background:#fff0d9;color:#805009}.red{background:#fce8e4;color:#983e30}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.stats strong{display:block;font-size:32px;margin:10px 0}.issue{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #e6eae3}.issue h3{margin:8px 0}.issue p{margin:5px 0}.notice{border-radius:12px;padding:14px;background:#edf3ec;margin:18px 0;font-size:14px}#message{color:#933d2b;font-weight:600}dialog{border:1px solid #dce2db;border-radius:18px;max-width:480px;padding:26px}dialog::backdrop{background:#163e3066}@media(max-width:900px){.layout{grid-template-columns:1fr;gap:16px}.sidebar{padding:14px}.steps{display:flex;overflow:auto;margin:0;gap:5px}.steps li{white-space:nowrap;font-size:12px;padding:10px}.sidebar .eyebrow,.sidebar>p{display:none}.grid{grid-template-columns:1fr;gap:0}.card{padding:20px}.stats{gap:8px}.stats .card{padding:14px;font-size:12px}.stats strong{font-size:26px}.brand{padding:18px 20px}.brand>span{font-size:12px}.footer span{display:none}.issue{align-items:flex-start;flex-direction:column;gap:8px}nav{margin:16px auto}main{padding-top:0}}
[hidden]{display:none!important}.photo-actions{display:flex;gap:8px;flex-wrap:wrap}.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,140px));gap:10px}.photo-grid figure{margin:0}.photo-grid img{width:100%;height:100px;object-fit:cover;border-radius:8px}.photo-grid button{width:100%;font-size:13px}.syncbar{max-width:1100px;margin:8px auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;font-size:12px;color:#506755}.syncbar button{min-height:40px;padding:8px;font-size:12px}.layout>*{min-width:0}input,select,textarea{min-width:0;max-width:100%}
button:disabled{opacity:.45;cursor:default}.grid>*{min-width:0}.notice{overflow-wrap:anywhere}.footer button{touch-action:manipulation}

 .brand{padding:10px 16px;gap:8px}.brand strong{font-size:16px}.brand small{display:none}.demo{font-size:11px;padding:6px 10px}
 nav{margin:10px auto;padding:0 12px;gap:8px}nav button{flex:1;font-size:13px;padding:10px 8px}
 main{padding:0 12px calc(96px + env(safe-area-inset-bottom))}main>.eyebrow,main>h1,main>h1+p{display:none}
 .layout{margin-top:0;gap:10px}.sidebar{border-radius:12px;background:#e1eee5}

 .footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.footer>div{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.footer button{min-width:0;font-size:15px}
  .stats{margin:12px 0}.stats .card{padding:10px}.stats .badge{white-space:normal;padding:5px;font-size:10px}

.daily-board{margin:16px 0}.daily-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.daily-list button{text-align:left}.daily-list span{display:block;font-size:14px;margin-top:6px}.main-actions button{flex:1;min-height:52px}.main-actions button.active{background:#82110e;color:white}button,input,select{min-height:52px}.question h3{font-size:19px}.choices button{font-size:16px}label{font-size:16px}@media(max-width:900px){.choices button{font-size:16px;min-height:52px}.question h3{font-size:18px}.question p{font-size:14px}.main-actions{margin:12px auto}.main-actions button{font-size:15px}.daily-board h2{font-size:19px}}
</style><link rel="stylesheet" href="/brand.css"></head><body>
<header class="brand"><div class="brand-identity"><img class="brand-logo" src="/assets/logo.png" alt="Fornalha Mineira — Pão de Queijo"><div><strong>FORNALHA</strong><small>Cuidado diário com a frota</small></div></div><span>Vistoria da frota</span></header>
<div class="demo">VISTORIA DA FROTA · Registros salvos</div>

<div class="syncbar"><span id="queueStatus" role="status">Verificando envios…</span><button onclick="syncInspections()">Sincronizar</button></div><div class="syncbar"><span id="draftStatus" role="status">Preparando rascunho…</span><button type="button" onclick="discardDraft()">Descartar rascunho</button></div><nav class="main-actions" aria-label="Tipo de registro"><button type="button" onclick="openMode(false)">Vistoria de saída</button><button type="button" onclick="openMode(true)">Registrar ocorrência</button></nav><main id="app"></main><footer class="footer" id="footer"></footer>
<dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" onclick="document.getElementById('modal').close()">Entendi</button></dialog>
<input type="file" id="cameraFile" accept="image/jpeg,image/png,image/webp" capture="environment" hidden onchange="addPhotos(this)"><input type="file" id="galleryFile" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="addPhotos(this)"><script src="photos.js"></script><script src="trip-rules.js"></script><script src="mileage.js"></script><script src="daily-checks.js"></script><script>
let vehicles=['Master curta 01','Master curta 02','Master longa · 2018','Ducato · 2025','Mobi vendedor 01','Mobi vendedor 02'];
const groups=[
 ['Carroceria',[['avarias','Carroceria e portas','Confira batidas, riscos novos, portas e fechamento da carga.']]],
 ['Luzes',[['luzes','Luzes e visibilidade','Faróis, setas, luz de freio, retrovisores e limpadores.']]],
 ['Pneus e freios',[['pneus','Pneus e rodas','Confira danos e aparência de baixa pressão.'],['freios','Freios e direção','Registre avisos ou anormalidades percebidas.']]],
 ['Segurança e painel',[['seguranca','Equipamentos de segurança','Confira os equipamentos de segurança aplicáveis.'],['painel','Painel e alertas','Observe luzes de alerta e mensagens no painel.'],['cintos','Cintos de segurança','Confira cintos, travas e condições de uso.']]],
 ['Motor e óleo',[['motor','Motor','Observe ruídos, sinais de vazamento e funcionamento.'],['oleo','Nível de óleo','Verifique seguindo o manual e em condições seguras.']]]
];
const isIncident=typeof location!=='undefined'&&new URLSearchParams(location.search).get('mode')==='incident';
let step=0,inspectionState={name:'',inspector:'Lucas',vehicle:0,type:isIncident?'Ocorrência':'Saída',km:'',temp:'',category:'Batida ou avaria',description:'',location:'',severity:'Não sei avaliar'},answers={},notes={},levels={};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let fleet=vehicles.map((name,id)=>({id,name,active:true,refrigerated:id<4}));
let tripControl=false;
let drivers=['Motorista 01 · exemplo','Motorista 02 · exemplo','Motorista 03 · exemplo','Vendedor 01 · exemplo','Vendedor 02 · exemplo'].map((name,i)=>({id:i+1,name,active:true}));
function selectDriver(name){inspectionState.name=name;const d=drivers.find(d=>d.name===name);inspectionState.driverId=d?.id;const v=fleet.find(v=>v.id===d?.suggestedVehicleId&&v.active);if(v)inspectionState.vehicle=v.id;selectTrip();suggestMileage(true);render();if(typeof refreshTripState==='function')refreshTripState();}
function selectedTrip(){return drivers.find(d=>d.id===inspectionState.driverId)?.trip;}
function selectTrip(){inspectionState.type=isIncident?'Ocorrência':'Saída';}
function tripMessage(){return '';}
function tripNotice(){return '<p class="muted">Conferência antes da saída. Não é necessário preencher retorno.</p>';}
function dailyBoard(){
 if(isIncident||step!==0)return '';
 const pending=fleet.filter(v=>FornalhaDaily.status(v)==='due');
 return `<section class="card daily-board"><h2>Conferir antes de sair</h2><p class="muted">Veículos com saída em dias anteriores e ainda sem nova vistoria hoje. A lista continua pendente até uma nova conferência de saída.</p>${pending.length?`<div class="daily-list">${pending.map(v=>`<button type="button" onclick="selectDailyVehicle(${v.id})"><strong>${esc(v.name)}</strong><span>Última saída: ${esc(new Date(v.lastDeparture.inspectedAt).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}))}</span><span>Iniciar conferência →</span></button>`).join('')}</div>`:'<p>Nenhuma nova conferência pendente nas saídas recebidas.</p>'}<small>Registros offline aparecem após sincronizar. Este aviso aparece ao abrir o sistema.</small></section>`;
}
function selectDailyVehicle(id){const v=fleet.find(v=>v.id===id);if(!v)return;inspectionState.vehicle=id;const d=drivers.find(d=>d.id===v.lastDeparture?.driverId&&d.active);inspectionState.name=d?.name||'';inspectionState.driverId=d?.id;suggestMileage(true);render();}
let kmEdited=false,kmAutoKey='';
function mileageVehicle(){return fleet.find(v=>v.id===Number(inspectionState.vehicle));}
function suggestMileage(reset=false){
 const key=inspectionState.vehicle+'/'+inspectionState.type;
 if(reset||key!==kmAutoKey){kmEdited=false;inspectionState.kmNote='';kmAutoKey=key;}
 if(!kmEdited){const ref=FornalhaMileage.reference(mileageVehicle());inspectionState.km=!isIncident&&ref?String(ref.km):'';}
}
function selectVehicle(value){inspectionState.vehicle=Number(value);suggestMileage(true);render();}
function selectInspectionType(value){inspectionState.type=value;suggestMileage(true);render();}
function editMileage(value){inspectionState.km=value;kmEdited=true;document.getElementById('mileageHint').innerHTML=mileageHint();}
function mileageHint(){
 const ref=FornalhaMileage.reference(mileageVehicle()),fmt=n=>Number(n).toLocaleString('pt-BR');
 let text=ref?`Última leitura: <strong>${fmt(ref.km)} km</strong> · ${esc(new Date(ref.inspectedAt).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}))}. Confira o painel e altere se necessário.`:'Este veículo ainda não tem quilometragem registrada.';
 const entered=String(inspectionState.km).trim()===''?null:Number(inspectionState.km);
 if(Number.isSafeInteger(entered)&&ref&&entered<ref.km)text+='<br><strong>Leitura abaixo da referência. Confira o painel e explique na observação se estiver correta.</strong>';
 if(Number.isSafeInteger(entered)&&ref&&entered>ref.km)text+=`<br>Diferença desde a última leitura: +${fmt(entered-ref.km)} km. Não é atribuída automaticamente a um motorista.`;
 return `<p class="muted">${text}</p>`;
}
function refrigerated(){return !!fleet.find(v=>v.id===Number(inspectionState.vehicle))?.refrigerated}
function stages(){if(isIncident)return ['Ocorrência rápida'];return ['Identificação',...groups.map(g=>g[0]),...(refrigerated()?['Refrigeração']:[]),'Revisão']}

function selectOil(value){inspectionState.oilLevel=value;answers.oleo=value==='No nível'?'OK':value==='Não verifiquei'?'Não verifiquei':'Problema';render();}
function oilChoices(){return `<div class="choices oil-choices" role="group" aria-label="Nível de óleo">${['No nível','Metade','Baixo','Não verifiquei'].map((v,i)=>`<button type="button" data-value="${i===0?'OK':'Problema'}" class="${inspectionState.oilLevel===v?'selected':''}" aria-pressed="${inspectionState.oilLevel===v}" onclick="selectOil('${v}')">${i<3?`<svg aria-hidden="true" viewBox="0 0 100 32" width="100" height="32"><circle cx="12" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="4"/><rect x="23" y="12" width="70" height="8" rx="3" fill="#ddd"/><rect x="23" y="12" width="${[68,35,12][i]}" height="8" fill="${['#287453','#bd7800','#b32c20'][i]}"/><path d="M38 8v16M90 8v16" stroke="currentColor"/></svg><br>`:''}${v}</button>`).join('')}</div><p class="muted">Desenho ilustrativo. Confira as marcas da vareta seguindo o manual. Metade e Baixo abrem um problema para avaliação.</p>`;}
function question(q){let [id,title,help]=q;return `<section class="question"><h3>${title}</h3><p class="muted">${help}</p>${id==='oleo'?oilChoices():`<div class="choices" role="group" aria-label="${title}">${['OK','Problema','Não verifiquei'].map(v=>`<button data-value="${v}" class="${answers[id]===v?'selected':''}" aria-pressed="${answers[id]===v}" onclick="answers['${id}']='${v}';render()">${v}</button>`).join('')}</div>`}${answers[id]==='Problema'?`<div class="details"><label>O que você encontrou?<textarea oninput="notes['${id}']=this.value">${esc(notes[id]||'')}</textarea></label><label>Como você avalia?<select onchange="levels['${id}']=this.value">${['Não sei avaliar','Leve','Atenção','Crítico'].map(v=>`<option ${levels[id]===v?'selected':''}>${v}</option>`).join('')}</select></label>${typeof renderPhotos==='function'?renderPhotos(id):''}</div>`:''}</section>`}
function showModal(t,p){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=p;document.getElementById('modal').showModal()}
function tempNotice(){let t=Number(inspectionState.temp);return inspectionState.temp.trim()!==''&&Number.isFinite(t)&&t>=-13?'<div class="notice amber" role="status">Atenção à refrigeração — avaliar manutenção em breve.</div>':''}
function identityFields(){return `<label>Responsável pela conferência<input maxlength="100" value="${esc(inspectionState.inspector||'')}" oninput="inspectionState.inspector=this.value" autocomplete="name"></label><label>Motorista<select onchange="selectDriver(this.value)"><option value="">Selecionar motorista</option>${drivers.filter(d=>d.active).map(d=>`<option ${inspectionState.name===d.name?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>Veículo<select onchange="selectVehicle(this.value)">${fleet.filter(v=>v.active).map(v=>`<option value="${v.id}" ${Number(inspectionState.vehicle)===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label><label>Quilometragem atual${isIncident?' (opcional)':''}<input type="number" min="0" step="1" inputmode="numeric" placeholder="Leia o painel do veículo" value="${esc(inspectionState.km)}" oninput="editMileage(this.value)" aria-describedby="mileageHint"></label><div id="mileageHint" role="status">${mileageHint()}</div>`;}
function incidentContent(){return `<h2>Registrar ocorrência</h2><p class="muted">Batida, defeito ou quebra, a qualquer momento. Este registro não substitui a vistoria de saída.</p>${identityFields()}<label>Tipo de ocorrência<select onchange="inspectionState.category=this.value">${['Batida ou avaria','Defeito','Quebra na rua','Outro'].map(v=>`<option ${inspectionState.category===v?'selected':''}>${v}</option>`).join('')}</select></label><label>O que aconteceu?<textarea maxlength="2000" oninput="inspectionState.description=this.value" placeholder="Descreva o problema e as providências tomadas.">${esc(inspectionState.description||'')}</textarea></label><label>Onde aconteceu? (opcional)<input maxlength="300" value="${esc(inspectionState.location||'')}" oninput="inspectionState.location=this.value" placeholder="Ex.: fábrica ou nome da rua"></label><label>Gravidade<select onchange="inspectionState.severity=this.value">${['Não sei avaliar','Leve','Atenção','Crítico'].map(v=>`<option ${inspectionState.severity===v?'selected':''}>${v}</option>`).join('')}</select></label>${typeof renderPhotos==='function'?renderPhotos('ocorrencia'):''}`;}
function generalPhotoFields(){return '<h3>Fotos gerais obrigatórias</h3><p>Fotografe o carro inteiro em cada posição, com boa iluminação, mesmo quando estiver OK. Quatro fotos gerais contam no limite de dez.</p>'+[['frente','Frente'],['traseira','Traseira'],['lateral_esquerda','Lateral esquerda'],['lateral_direita','Lateral direita']].map(([id,label])=>`<section><h3>${label}</h3>${typeof renderPhotos==='function'?renderPhotos(id):''}</section>`).join('');}
function content(){if(isIncident)return incidentContent();if(step===0)return `<h2>Conferência de saída</h2><p class="muted">Confira o veículo pessoalmente. O motorista abaixo é quem vai utilizá-lo.</p>${identityFields()}${tripNotice()}<details class="km-note"><summary>Observação da quilometragem (opcional)</summary><label>Observação<textarea maxlength="500" oninput="inspectionState.kmNote=this.value">${esc(inspectionState.kmNote||'')}</textarea></label></details>`;
if(step<=groups.length)return `<h2>${groups[step-1][0]}</h2>${groups[step-1][1].map(question).join('')}${step===1?generalPhotoFields():''}`;
if(refrigerated()&&step===groups.length+1)return `<h2>Refrigeração</h2><p class="muted">Pão de queijo congelado · referência informada: −18 °C a −16 °C.</p>${question(['frio','Equipamento de refrigeração','Observe o funcionamento e relate qualquer anormalidade.'])}<label style="margin-top:22px">Temperatura indicada (°C) — opcional<input type="number" step="0.1" placeholder="Ex.: -16" value="${esc(inspectionState.temp)}" oninput="inspectionState.temp=this.value;document.getElementById('tempNotice').innerHTML=tempNotice()"></label><div id="tempNotice">${tempNotice()}</div>`;
let ids=groups.flatMap(g=>g[1].map(q=>q[0])).concat(refrigerated()?['frio']:[]);return `<span class="badge">Última etapa</span><h2>Confira antes de concluir</h2><p><strong>${esc(vehicles[inspectionState.vehicle])}</strong><br>${esc(inspectionState.name)} · Conferido por ${esc(inspectionState.inspector)} · ${esc(inspectionState.type)} · ${esc(inspectionState.km)} km</p>${inspectionState.kmNote?`<p>Observação da quilometragem: ${esc(inspectionState.kmNote)}</p>`:''}${groups.flatMap(g=>g[1]).concat(refrigerated()?[['frio','Refrigeração']]:[]).map(q=>`<div class="issue"><span>${q[1]}</span><span class="badge ${answers[q[0]]==='Problema'?'amber':''}">${esc(q[0]==='oleo'?(inspectionState.oilLevel||'Pendente'):answers[q[0]]||'Pendente')}</span></div>`).join('')}${refrigerated()?`<p>Temperatura: <strong>${String(inspectionState.temp).trim()===''?'Não informada':esc(inspectionState.temp)+' °C'}</strong></p>${tempNotice()}`:''}<div class="notice">Ao concluir, a vistoria será salva neste aparelho e enviada ao servidor. As fotos anexadas serão enviadas junto com as respostas.</div>`}
function next(){if(step===0&&typeof checkTripBeforeStart==='function'){checkTripBeforeStart();return;}advanceStep();}
function advanceStep(){
 let error='';
 if(step===0){
  if(!String(inspectionState.inspector||'').trim())error='Informe o responsável pela conferência.';
  else if(!inspectionState.name)error='Selecione o motorista na lista.';
  else if(!fleet.some(v=>v.active&&v.id===Number(inspectionState.vehicle)))error='Selecione um veículo ativo.';
  else if(!isIncident&&String(inspectionState.km).trim()==='')error='Informe a quilometragem atual.';
  else if(String(inspectionState.km).trim()!==''&&(!Number.isSafeInteger(Number(inspectionState.km))||Number(inspectionState.km)<0))error='Informe a quilometragem em quilômetros inteiros, sem valor negativo.';
  else if(isIncident&&!String(inspectionState.description||'').trim())error='Descreva o que aconteceu.';
 }
 const qs=!isIncident&&step>=1&&step<=groups.length?groups[step-1][1]:!isIncident&&refrigerated()&&step===groups.length+1?[['frio']]:[];
 if(qs.some(q=>q[0]==='oleo')&&!inspectionState.oilLevel)error='Selecione o nível de óleo observado.';
 if(qs.some(q=>!answers[q[0]]))error='Responda todos os itens para continuar.';
 if(qs.some(q=>answers[q[0]]==='Problema'&&!(notes[q[0]]||'').trim()))error='Descreva o problema encontrado.';
 if(!isIncident&&refrigerated()&&step===groups.length+1&&String(inspectionState.temp).trim()!==''&&!Number.isFinite(Number(inspectionState.temp)))error='Informe a temperatura indicada.';
 if(!isIncident&&step===1&&['frente','traseira','lateral_esquerda','lateral_direita'].some(id=>!inspectionPhotos.some(p=>p.item===id)))error='Adicione as quatro fotos gerais do veículo antes de continuar.';
 if(error){document.getElementById('message').textContent=error;return;}
 if(isIncident||step===stages().length-1){completeInspection();return;}
 step++;render();window.scrollTo(0,0);
}
function render(){document.getElementById('footer').hidden=false;let ss=stages();document.getElementById('app').innerHTML=`<div class="eyebrow">${isIncident?"Registro avulso":"Checklist diário"}</div><h1>${isIncident?"Ocorrência do veículo":"Vistoria do veículo"}</h1><p class="muted">Confira os itens e registre os problemas encontrados.</p><div class="layout"><aside class="card sidebar"><div class="eyebrow">Sua vistoria</div><ol class="steps">${ss.map((s,i)=>`<li class="${i===step?'current':i<step?'done':''}" ${i===step?'aria-current="step"':''}>${i<step?'✓':i+1} · ${s}</li>`).join('')}</ol><p class="muted">${isIncident?'Registro a qualquer momento':step?esc(vehicles[inspectionState.vehicle]):'Conferência de saída · 6h–9h'}</p></aside><section class="card">${content()}<p id="message" role="alert"></p></section></div>`;document.getElementById('footer').innerHTML=`<div><button onclick="if(step>0){step--;render();window.scrollTo(0,0)}" ${step===0?'disabled':''}>← Voltar</button><span>Etapa ${step+1} de ${ss.length}</span><button class="primary" onclick="next()">${isIncident?'Salvar ocorrência':step===ss.length-1?'Concluir vistoria':'Continuar →'}</button></div>`}
render();
</script><script src="outbox.js"></script><script src="drafts.js"></script><script src="driver.js"></script></body></html>
