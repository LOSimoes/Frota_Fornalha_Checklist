<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fornalha · Vistoria da frota</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#20352e;background:#f3f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:48px;border:1px solid #ccd5cd;border-radius:12px;background:white;color:#20352e;padding:12px 18px;font-weight:600}button:hover{border-color:#287453}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d78325;outline-offset:3px}.brand{background:#163e30;color:white;padding:22px max(24px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand strong{letter-spacing:3px;font-size:20px}.brand small{display:block;color:#c8d9cf;margin-top:5px;letter-spacing:0}.demo{background:#f7e8c9;text-align:center;font-size:13px;padding:10px;color:#604918}nav{display:flex;gap:8px;max-width:1100px;margin:24px auto;padding:0 20px}nav button.active,.primary{background:#215f46;color:#fff;border-color:#215f46}main{max-width:1100px;margin:auto;padding:8px 20px 130px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#5f776b;font-weight:700}h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1px;margin:10px 0}p{line-height:1.5}.muted{color:#65746b}.layout{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:28px}.card{background:white;border:1px solid #dce2db;border-radius:18px;padding:24px}.steps{list-style:none;padding:0;margin:18px 0}.steps li{padding:14px 12px;border-radius:10px;color:#6c786f;margin:4px 0}.steps .current{background:#e1eee5;color:#204f39;font-weight:700}.steps .done{color:#287453}label{display:block;font-weight:600;margin:0 0 18px}input,select,textarea{display:block;width:100%;border:1px solid #bdcbbf;border-radius:10px;padding:13px;background:white;margin-top:8px;min-height:48px}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.question{border-bottom:1px solid #e6eae3;padding:19px 0}.question:first-child{padding-top:0}.question h3{font-size:17px;margin:0 0 7px}.question p{font-size:14px;margin:0 0 14px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{font-size:14px;flex:1;padding:11px 8px}.choices button.selected[data-value="OK"]{background:#e0f0e5;border-color:#328154}.choices button.selected[data-value="Problema"]{background:#fff0d9;border-color:#c38021}.choices button.selected[data-value="Não verifiquei"]{background:#e9eceb;border-color:#708077}.details{background:#fff8ec;padding:16px;border-radius:12px;margin-top:16px}.details label:last-child{margin-bottom:0}.footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid #dce2db;padding:16px 20px;backdrop-filter:blur(10px)}.footer>div{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px}.footer span{align-self:center;color:#65746b;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;background:#e6eee7;color:#326042}.amber{background:#fff0d9;color:#805009}.red{background:#fce8e4;color:#983e30}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.stats strong{display:block;font-size:32px;margin:10px 0}.issue{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #e6eae3}.issue h3{margin:8px 0}.issue p{margin:5px 0}.notice{border-radius:12px;padding:14px;background:#edf3ec;margin:18px 0;font-size:14px}#message{color:#933d2b;font-weight:600}dialog{border:1px solid #dce2db;border-radius:18px;max-width:480px;padding:26px}dialog::backdrop{background:#163e3066}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:16px}.sidebar{padding:14px}.steps{display:flex;overflow:auto;margin:0;gap:5px}.steps li{white-space:nowrap;font-size:12px;padding:10px}.sidebar .eyebrow,.sidebar>p{display:none}.grid{grid-template-columns:1fr;gap:0}.card{padding:20px}.stats{gap:8px}.stats .card{padding:14px;font-size:12px}.stats strong{font-size:26px}.brand{padding:18px 20px}.brand>span{font-size:12px}.footer span{display:none}.issue{align-items:flex-start;flex-direction:column;gap:8px}nav{margin:16px auto}main{padding-top:0}}
</style></head><body>
<header class="brand"><div><strong>FORNALHA</strong><small>Cuidado diário com a frota</small></div><span>Frota · 6 veículos</span></header>
<div class="demo">MODELO INTERATIVO · Dados de exemplo · Sem envio ao servidor</div>
<nav aria-label="Área do aplicativo"><button id="driverTab" class="active" onclick="switchView('driver')">Fazer vistoria</button><button id="managerTab" onclick="switchView('manager')">Painel do gestor</button></nav>
<main id="app"></main><footer class="footer" id="footer"></footer>
<dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" onclick="document.getElementById('modal').close()">Entendi</button></dialog>
<script>
const vehicles=['Master curta 01','Master curta 02','Master longa · 2018','Ducato · 2025','Mobi vendedor 01','Mobi vendedor 02'];
const groups=[['Pneus e freios',[['pneus','Pneus e rodas','Confira visualmente danos e aparência de baixa pressão.'],['freios','Freios e direção','Registre avisos ou anormalidades percebidas.']]],['Luzes e motor',[['luzes','Luzes e visibilidade','Faróis, setas, luz de freio, retrovisores e limpadores.'],['oleo','Nível de óleo','Verifique seguindo o manual e em condições seguras.'],['motor','Motor e painel','Observe alertas, ruídos e sinais de vazamento.']]],['Carroceria e carga',[['avarias','Carroceria e portas','Observe batidas, riscos novos e fechamento das portas.'],['seguranca','Cintos e equipamentos','Confira cintos e equipamentos de segurança aplicáveis.']]]];
let view='driver',step=0,form={name:'',vehicle:0,type:'Saída',km:'',temp:''},answers={},notes={},levels={};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function refrigerated(){return Number(form.vehicle)<4}
function stages(){return ['Identificação',...groups.map(g=>g[0]),...(refrigerated()?['Refrigeração']:[]),'Revisão']}
function switchView(v){view=v;render()}
function question(q){let [id,title,help]=q;return `<section class="question"><h3>${title}</h3><p class="muted">${help}</p><div class="choices" role="group" aria-label="${title}">${['OK','Problema','Não verifiquei'].map(v=>`<button data-value="${v}" class="${answers[id]===v?'selected':''}" aria-pressed="${answers[id]===v}" onclick="answers['${id}']='${v}';render()">${v}</button>`).join('')}</div>${answers[id]==='Problema'?`<div class="details"><label>O que você encontrou?<textarea oninput="notes['${id}']=this.value">${esc(notes[id]||'')}</textarea></label><label>Como você avalia?<select onchange="levels['${id}']=this.value">${['Não sei avaliar','Leve','Atenção','Crítico'].map(v=>`<option ${levels[id]===v?'selected':''}>${v}</option>`).join('')}</select></label><button onclick="showModal('Foto da ocorrência','Na versão completa, este botão abrirá a câmera ou a galeria do celular. Neste modelo, nenhuma foto é armazenada.')">＋ Adicionar foto</button></div>`:''}</section>`}
function showModal(t,p){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=p;document.getElementById('modal').showModal()}
function tempNotice(){let t=Number(form.temp);return form.temp!==''&&t>=-14&&t<=-10?'<div class="notice amber">Atenção à refrigeração — avaliar manutenção em breve.</div>':''}
function content(){if(step===0)return `<h2>Vamos começar</h2><p class="muted">Escolha seu nome e o veículo que vai conferir.</p><label>Seu nome<select onchange="form.name=this.value"><option value="">Selecionar nome</option>${['Motorista 01 · exemplo','Motorista 02 · exemplo','Motorista 03 · exemplo','Vendedor 01 · exemplo','Vendedor 02 · exemplo'].map(n=>`<option ${form.name===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Veículo<select onchange="form.vehicle=Number(this.value);render()">${vehicles.map((n,i)=>`<option value="${i}" ${Number(form.vehicle)===i?'selected':''}>${n}</option>`).join('')}</select></label><div class="grid"><label>Vistoria<select onchange="form.type=this.value"><option ${form.type==='Saída'?'selected':''}>Saída</option><option ${form.type==='Retorno'?'selected':''}>Retorno</option></select></label><label>Quilometragem atual<input type="number" min="0" step="1" inputmode="numeric" placeholder="Ex.: 82450" value="${esc(form.km)}" oninput="form.km=this.value"></label></div>`;
if(step<=3)return `<h2>${groups[step-1][0]}</h2>${groups[step-1][1].map(question).join('')}`;
if(refrigerated()&&step===4)return `<h2>Refrigeração</h2><p class="muted">Pão de queijo congelado · referência informada: −18 °C a −16 °C.</p>${question(['frio','Equipamento de refrigeração','Observe o funcionamento e relate qualquer anormalidade.'])}<label style="margin-top:22px">Temperatura indicada (°C)<input type="number" step="0.1" placeholder="Ex.: -16" value="${esc(form.temp)}" oninput="form.temp=this.value;document.getElementById('tempNotice').innerHTML=tempNotice()"></label><div id="tempNotice">${tempNotice()}</div>`;
let ids=groups.flatMap(g=>g[1].map(q=>q[0])).concat(refrigerated()?['frio']:[]);return `<span class="badge">Última etapa</span><h2>Confira antes de concluir</h2><p><strong>${esc(vehicles[form.vehicle])}</strong><br>${esc(form.name)} · ${esc(form.type)} · ${esc(form.km)} km</p>${groups.flatMap(g=>g[1]).concat(refrigerated()?[['frio','Refrigeração']]:[]).map(q=>`<div class="issue"><span>${q[1]}</span><span class="badge ${answers[q[0]]==='Problema'?'amber':''}">${esc(answers[q[0]]||'Pendente')}</span></div>`).join('')}${refrigerated()?`<p>Temperatura: <strong>${esc(form.temp)} °C</strong></p>${tempNotice()}`:''}<div class="notice">Demonstração: as respostas ficam somente nesta página e serão perdidas ao recarregar.</div>`}
function next(){let error='';if(step===0&&(!form.name||form.km===''||!Number.isInteger(Number(form.km))||Number(form.km)<0))error='Selecione seu nome e informe uma quilometragem válida.';let qs=step>=1&&step<=3?groups[step-1][1]:refrigerated()&&step===4?[['frio']]:[];if(qs.some(q=>!answers[q[0]]))error='Responda todos os itens para continuar.';if(qs.some(q=>answers[q[0]]==='Problema'&&!(notes[q[0]]||'').trim()))error='Descreva o problema encontrado.';if(refrigerated()&&step===4&&(form.temp===''||!Number.isFinite(Number(form.temp))))error='Informe a temperatura indicada.';if(error){document.getElementById('message').textContent=error;return}if(step===stages().length-1){showModal('Vistoria demonstrada','Você chegou ao fim do fluxo. Este modelo não salvou nem enviou uma vistoria real. Na versão completa, aqui aparecerá a confirmação de salvamento e o estado do envio.');return}step++;render();window.scrollTo(0,0)}
function render(){document.getElementById('driverTab').classList.toggle('active',view==='driver');document.getElementById('managerTab').classList.toggle('active',view==='manager');if(view==='manager'){document.getElementById('footer').hidden=true;document.getElementById('app').innerHTML=`<div class="eyebrow">Visão do gestor · exemplo</div><h1>O que precisa de atenção</h1><p class="muted">Pendências primeiro. Histórico e providências no mesmo lugar.</p><div class="stats"><div class="card">Pendências<strong>3</strong><span class="badge red">1 prioritária</span></div><div class="card">Saídas<strong>4 / 6</strong><span class="muted">Vistorias recebidas</span></div><div class="card">Retornos<strong>0 / 6</strong><span class="muted">Ainda não recebidos</span></div></div><div class="card"><div class="eyebrow">Pendências de exemplo</div>${[['red','Prioritário','Master longa · 2018','Motorista relatou anormalidade nos freios.','Avaliar antes de liberar.'],['amber','Manutenção','Ducato · 2025','Refrigeração: temperatura registrada de −12 °C.','Avaliar manutenção em breve.'],['','Avaria','Mobi vendedor 01','Risco novo na porta direita.','Conferir ocorrência e registrar providência.']].map(x=>`<div class="issue"><div><span class="badge ${x[0]}">${x[1]}</span><h3>${x[2]}</h3><p>${x[3]}</p><p class="muted">${x[4]}</p></div><button onclick="showModal('Providência · demonstração','Na versão completa, Lucas poderá registrar a avaliação, o serviço agendado e a resolução desta ocorrência, mantendo o histórico.')">Ver ocorrência →</button></div>`).join('')}</div><p class="muted">Todos os números e relatos acima são fictícios.</p>`;return}document.getElementById('footer').hidden=false;let ss=stages();document.getElementById('app').innerHTML=`<div class="eyebrow">Checklist diário</div><h1>Uma conferência. Mais tranquilidade.</h1><p class="muted">Siga os itens na ordem e registre o que precisa de atenção.</p><div class="layout"><aside class="card sidebar"><div class="eyebrow">Sua vistoria</div><ol class="steps">${ss.map((s,i)=>`<li class="${i===step?'current':i<step?'done':''}" ${i===step?'aria-current="step"':''}>${i<step?'✓':i+1} · ${s}</li>`).join('')}</ol><p class="muted">${step?esc(vehicles[form.vehicle]):'Saída: 6h–9h<br>Retorno: 15h–18h'}</p></aside><section class="card">${content()}<p id="message" role="alert"></p></section></div>`;document.getElementById('footer').innerHTML=`<div><button onclick="if(step>0){step--;render();window.scrollTo(0,0)}" ${step===0?'disabled':''}>← Voltar</button><span>Etapa ${step+1} de ${ss.length} · Modelo interativo</span><button class="primary" onclick="next()">${step===ss.length-1?'Concluir vistoria':'Continuar →'}</button></div>`}
render();
</script></body></html>
