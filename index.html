<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fornalha · Vistoria da frota</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#82110E"><link rel="icon" href="/assets/favicon.ico"><link rel="apple-touch-icon" href="/assets/icon-256.png">
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#20352e;background:#f3f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:48px;border:1px solid #ccd5cd;border-radius:12px;background:white;color:#20352e;padding:12px 18px;font-weight:600}button:hover{border-color:#287453}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d78325;outline-offset:3px}.brand{background:#163e30;color:white;padding:22px max(24px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand strong{letter-spacing:3px;font-size:20px}.brand small{display:block;color:#c8d9cf;margin-top:5px;letter-spacing:0}.demo{background:#f7e8c9;text-align:center;font-size:13px;padding:10px;color:#604918}nav{display:flex;gap:8px;max-width:1100px;margin:24px auto;padding:0 20px}nav button.active,.primary{background:#215f46;color:#fff;border-color:#215f46}main{max-width:1100px;margin:auto;padding:8px 20px 130px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#5f776b;font-weight:700}h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1px;margin:10px 0}p{line-height:1.5}.muted{color:#65746b}.layout{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:28px}.card{background:white;border:1px solid #dce2db;border-radius:18px;padding:24px}.steps{list-style:none;padding:0;margin:18px 0}.steps li{padding:14px 12px;border-radius:10px;color:#6c786f;margin:4px 0}.steps .current{background:#e1eee5;color:#204f39;font-weight:700}.steps .done{color:#287453}label{display:block;font-weight:600;margin:0 0 18px}input,select,textarea{display:block;width:100%;border:1px solid #bdcbbf;border-radius:10px;padding:13px;background:white;margin-top:8px;min-height:48px}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.question{border-bottom:1px solid #e6eae3;padding:19px 0}.question:first-child{padding-top:0}.question h3{font-size:17px;margin:0 0 7px}.question p{font-size:14px;margin:0 0 14px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{font-size:14px;flex:1;padding:11px 8px}.choices button.selected[data-value="OK"]{background:#e0f0e5;border-color:#328154}.choices button.selected[data-value="Problema"]{background:#fff0d9;border-color:#c38021}.choices button.selected[data-value="Não verifiquei"]{background:#e9eceb;border-color:#708077}.details{background:#fff8ec;padding:16px;border-radius:12px;margin-top:16px}.details label:last-child{margin-bottom:0}.footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid #dce2db;padding:16px 20px;backdrop-filter:blur(10px)}.footer>div{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px}.footer span{align-self:center;color:#65746b;font-size:13px}.badge{display:inline-block;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;background:#e6eee7;color:#326042}.amber{background:#fff0d9;color:#805009}.red{background:#fce8e4;color:#983e30}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.stats strong{display:block;font-size:32px;margin:10px 0}.issue{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #e6eae3}.issue h3{margin:8px 0}.issue p{margin:5px 0}.notice{border-radius:12px;padding:14px;background:#edf3ec;margin:18px 0;font-size:14px}#message{color:#933d2b;font-weight:600}dialog{border:1px solid #dce2db;border-radius:18px;max-width:480px;padding:26px}dialog::backdrop{background:#163e3066}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:16px}.sidebar{padding:14px}.steps{display:flex;overflow:auto;margin:0;gap:5px}.steps li{white-space:nowrap;font-size:12px;padding:10px}.sidebar .eyebrow,.sidebar>p{display:none}.grid{grid-template-columns:1fr;gap:0}.card{padding:20px}.stats{gap:8px}.stats .card{padding:14px;font-size:12px}.stats strong{font-size:26px}.brand{padding:18px 20px}.brand>span{font-size:12px}.footer span{display:none}.issue{align-items:flex-start;flex-direction:column;gap:8px}nav{margin:16px auto}main{padding-top:0}}
[hidden]{display:none!important}.photo-actions{display:flex;gap:8px;flex-wrap:wrap}.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,140px));gap:10px}.photo-grid figure{margin:0}.photo-grid img{width:100%;height:100px;object-fit:cover;border-radius:8px}.photo-grid button{width:100%;font-size:13px}.syncbar{max-width:1100px;margin:8px auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;font-size:12px;color:#506755}.syncbar button{min-height:40px;padding:8px;font-size:12px}.layout>*{min-width:0}input,select,textarea{min-width:0;max-width:100%}
button:disabled{opacity:.45;cursor:default}.grid>*{min-width:0}.notice{overflow-wrap:anywhere}.footer button{touch-action:manipulation}
@media(max-width:700px){
 .brand{padding:10px 16px;gap:8px}.brand strong{font-size:16px}.brand small{display:none}.demo{font-size:11px;padding:6px 10px}
 nav{margin:10px auto;padding:0 12px;gap:8px}nav button{flex:1;font-size:13px;padding:10px 8px}
 main{padding:0 12px calc(96px + env(safe-area-inset-bottom))}main>.eyebrow,main>h1,main>h1+p{display:none}
 .layout{margin-top:0;gap:10px}.sidebar{border-radius:12px;background:#e1eee5}
 .steps{display:block;overflow:visible;margin:0}.steps li{display:none;white-space:normal;margin:0;padding:0}.steps li.current{display:block;font-size:14px}
 .sidebar>p{display:block;font-size:12px;line-height:1.3;margin:5px 0 0}.card{padding:16px;border-radius:14px}.sidebar.card{padding:10px 12px}
 h2{font-size:21px;margin:0 0 12px}.card>h2+p{font-size:14px;margin:0 0 16px}
 label{font-size:14px;margin-bottom:14px}input,select,textarea{font-size:16px;padding:11px;margin-top:6px}
 .question{padding:16px 0}.question h3{font-size:16px}.question p{font-size:13px}
 .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{font-size:14px;padding:10px 6px;min-width:0}.choices button:last-child{grid-column:1 / -1}
 .footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.footer>div{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.footer button{min-width:0;font-size:15px}
  .stats{margin:12px 0}.stats .card{padding:10px}.stats .badge{white-space:normal;padding:5px;font-size:10px}
 dialog{width:calc(100% - 24px);max-height:calc(100dvh - 24px);overflow:auto;padding:20px}
}
</style><link rel="stylesheet" href="/brand.css"></head><body>
<header class="brand"><div class="brand-identity"><img class="brand-logo" src="/assets/logo.png" alt="Fornalha Mineira — Pão de Queijo"><div><strong>FORNALHA</strong><small>Cuidado diário com a frota</small></div></div><span>Vistoria da frota</span></header>
<div class="demo">VISTORIA DA FROTA · Registros salvos</div>

<div class="syncbar"><span id="queueStatus" role="status">Verificando envios…</span><button onclick="syncInspections()">Sincronizar</button></div><main id="app"></main><footer class="footer" id="footer"></footer>
<dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" onclick="document.getElementById('modal').close()">Entendi</button></dialog>
<input type="file" id="cameraFile" accept="image/jpeg,image/png,image/webp" capture="environment" hidden onchange="addPhotos(this)"><input type="file" id="galleryFile" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="addPhotos(this)"><script src="photos.js"></script><script src="trip-rules.js"></script><script src="mileage.js"></script><script>
let vehicles=['Master curta 01','Master curta 02','Master longa · 2018','Ducato · 2025','Mobi vendedor 01','Mobi vendedor 02'];
const groups=[['Pneus e freios',[['pneus','Pneus e rodas','Confira visualmente danos e aparência de baixa pressão.'],['freios','Freios e direção','Registre avisos ou anormalidades percebidas.']]],['Luzes e motor',[['luzes','Luzes e visibilidade','Faróis, setas, luz de freio, retrovisores e limpadores.'],['oleo','Nível de óleo','Verifique seguindo o manual e em condições seguras.'],['motor','Motor e painel','Observe alertas, ruídos e sinais de vazamento.']]],['Carroceria e carga',[['avarias','Carroceria e portas','Observe batidas, riscos novos e fechamento das portas.'],['seguranca','Cintos e equipamentos','Confira cintos e equipamentos de segurança aplicáveis.']]]];
let step=0,inspectionState={name:'',vehicle:0,type:'Saída',km:'',temp:''},answers={},notes={},levels={};
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let fleet=vehicles.map((name,id)=>({id,name,active:true,refrigerated:id<4}));
let tripControl=false;
let drivers=['Motorista 01 · exemplo','Motorista 02 · exemplo','Motorista 03 · exemplo','Vendedor 01 · exemplo','Vendedor 02 · exemplo'].map((name,i)=>({id:i+1,name,active:true}));
function selectDriver(name){inspectionState.name=name;const d=drivers.find(d=>d.name===name);inspectionState.driverId=d?.id;const v=fleet.find(v=>v.id===d?.suggestedVehicleId&&v.active);if(v)inspectionState.vehicle=v.id;selectTrip();suggestMileage(true);render();if(typeof refreshTripState==='function')refreshTripState();}
function selectedTrip(){return drivers.find(d=>d.id===inspectionState.driverId)?.trip;}
function selectTrip(){if(!tripControl)return;const pending=selectedTrip()?.pending;inspectionState.type=pending?'Retorno':'Saída';if(pending)inspectionState.vehicle=pending.vehicle;}
function tripMessage(){if(!tripControl||!inspectionState.name)return '';return FornalhaTrips.error(selectedTrip(),{type:inspectionState.type,vehicle:Number(inspectionState.vehicle)});}
function tripNotice(){if(!tripControl||!inspectionState.name)return '';const pending=selectedTrip()?.pending;return `<div class="notice" role="status">${pending?`Retorno pendente: <strong>${esc(pending.vehicleName)}</strong>. Conclua o retorno antes de sair com qualquer veículo.`:'Sem retorno pendente. Comece registrando a saída.'}</div>`;}
let kmEdited=false,kmAutoKey='';
function mileageVehicle(){return fleet.find(v=>v.id===Number(inspectionState.vehicle));}
function suggestMileage(reset=false){
 const key=inspectionState.vehicle+'/'+inspectionState.type;
 if(reset||key!==kmAutoKey){kmEdited=false;inspectionState.kmNote='';kmAutoKey=key;}
 if(!kmEdited){const ref=FornalhaMileage.reference(mileageVehicle());inspectionState.km=inspectionState.type==='Saída'&&ref?String(ref.km):'';}
}
function selectVehicle(value){inspectionState.vehicle=Number(value);suggestMileage(true);render();}
function selectInspectionType(value){inspectionState.type=value;suggestMileage(true);render();}
function editMileage(value){inspectionState.km=value;kmEdited=true;document.getElementById('mileageHint').innerHTML=mileageHint();}
function mileageHint(){
 const v=mileageVehicle(),ref=FornalhaMileage.reference(v),pending=selectedTrip()?.pending;
 const fmt=n=>Number(n).toLocaleString('pt-BR');
 const when=r=>new Date(r.inspectedAt).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
 let text=ref?`${v.lastReturn?'Último retorno':'Última leitura (ainda sem retorno)'}: <strong>${fmt(ref.km)} km</strong> · ${esc(when(ref))}.`:'Este veículo ainda não tem quilometragem registrada. Informe a leitura do painel.';
 if(inspectionState.type==='Retorno')text=Number.isSafeInteger(pending?.km)?`Saída registrada com <strong>${fmt(pending.km)} km</strong>. Informe a quilometragem atual do painel para fechar o retorno.`:'Informe a quilometragem atual do painel para fechar o retorno.';
 else if(ref)text+=' Valor sugerido; confira o painel e altere se necessário.';
 const entered=inspectionState.km.trim()===''?null:Number(inspectionState.km);
 const base=inspectionState.type==='Retorno'?pending?.km:ref?.km;
 if(Number.isSafeInteger(entered)&&Number.isSafeInteger(base)&&entered!==base){const delta=entered-base;text+=delta<0?`<br><strong>Confira: a leitura está ${fmt(-delta)} km abaixo da referência.</strong> Se estiver correta, mantenha o valor e explique na observação.`:inspectionState.type==='Saída'?`<br>Diferença antes desta saída: +${fmt(delta)} km. Isso não será atribuído automaticamente a você.`:'';}
 return `<p class="muted">${text}</p>`;
}
function refrigerated(){return !!fleet.find(v=>v.id===Number(inspectionState.vehicle))?.refrigerated}
function stages(){return ['Identificação',...groups.map(g=>g[0]),...(refrigerated()?['Refrigeração']:[]),'Revisão']}

function question(q){let [id,title,help]=q;return `<section class="question"><h3>${title}</h3><p class="muted">${help}</p><div class="choices" role="group" aria-label="${title}">${['OK','Problema','Não verifiquei'].map(v=>`<button data-value="${v}" class="${answers[id]===v?'selected':''}" aria-pressed="${answers[id]===v}" onclick="answers['${id}']='${v}';render()">${v}</button>`).join('')}</div>${answers[id]==='Problema'?`<div class="details"><label>O que você encontrou?<textarea oninput="notes['${id}']=this.value">${esc(notes[id]||'')}</textarea></label><label>Como você avalia?<select onchange="levels['${id}']=this.value">${['Não sei avaliar','Leve','Atenção','Crítico'].map(v=>`<option ${levels[id]===v?'selected':''}>${v}</option>`).join('')}</select></label>${typeof renderPhotos==='function'?renderPhotos(id):''}</div>`:''}</section>`}
function showModal(t,p){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=p;document.getElementById('modal').showModal()}
function tempNotice(){let t=Number(inspectionState.temp);return inspectionState.temp.trim()!==''&&Number.isFinite(t)&&t>=-13?'<div class="notice amber" role="status">Atenção à refrigeração — avaliar manutenção em breve.</div>':''}
function content(){if(step===0)return `<h2>Vamos começar</h2><p class="muted">Escolha seu nome e o veículo que vai conferir.</p><label>Seu nome<select onchange="selectDriver(this.value)"><option value="">Selecionar nome</option>${drivers.filter(d=>d.active||d.trip?.pending).map(d=>d.name).map(n=>`<option ${inspectionState.name===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label>${tripNotice()}<label>Veículo<select onchange="selectVehicle(this.value)">${fleet.filter(v=>v.active||v.id===selectedTrip()?.pending?.vehicle).map(v=>{const n=v.name,i=v.id;return `<option value="${i}" ${Number(inspectionState.vehicle)===i?'selected':''}>${esc(n)}</option>`}).join('')}</select></label><div class="grid"><label>Vistoria<select onchange="selectInspectionType(this.value)"><option ${inspectionState.type==='Saída'?'selected':''}>Saída</option><option ${inspectionState.type==='Retorno'?'selected':''}>Retorno</option></select></label><label>Quilometragem atual<input type="number" min="0" step="1" inputmode="numeric" placeholder="Ex.: 82450" value="${esc(inspectionState.km)}" oninput="editMileage(this.value)" aria-describedby="mileageHint"></label></div><div id="mileageHint" role="status">${mileageHint()}</div><details class="km-note"><summary>Observação da quilometragem (opcional)</summary><label>Observação<textarea maxlength="500" oninput="inspectionState.kmNote=this.value" placeholder="Ex.: o veículo foi usado antes da minha saída.">${esc(inspectionState.kmNote||'')}</textarea></label></details>`;
if(step<=3)return `<h2>${groups[step-1][0]}</h2>${groups[step-1][1].map(question).join('')}`;
if(refrigerated()&&step===4)return `<h2>Refrigeração</h2><p class="muted">Pão de queijo congelado · referência informada: −18 °C a −16 °C.</p>${question(['frio','Equipamento de refrigeração','Observe o funcionamento e relate qualquer anormalidade.'])}<label style="margin-top:22px">Temperatura indicada (°C)<input type="number" step="0.1" placeholder="Ex.: -16" value="${esc(inspectionState.temp)}" oninput="inspectionState.temp=this.value;document.getElementById('tempNotice').innerHTML=tempNotice()"></label><div id="tempNotice">${tempNotice()}</div>`;
let ids=groups.flatMap(g=>g[1].map(q=>q[0])).concat(refrigerated()?['frio']:[]);return `<span class="badge">Última etapa</span><h2>Confira antes de concluir</h2><p><strong>${esc(vehicles[inspectionState.vehicle])}</strong><br>${esc(inspectionState.name)} · ${esc(inspectionState.type)} · ${esc(inspectionState.km)} km</p>${inspectionState.kmNote?`<p>Observação da quilometragem: ${esc(inspectionState.kmNote)}</p>`:''}${groups.flatMap(g=>g[1]).concat(refrigerated()?[['frio','Refrigeração']]:[]).map(q=>`<div class="issue"><span>${q[1]}</span><span class="badge ${answers[q[0]]==='Problema'?'amber':''}">${esc(answers[q[0]]||'Pendente')}</span></div>`).join('')}${refrigerated()?`<p>Temperatura: <strong>${esc(inspectionState.temp)} °C</strong></p>${tempNotice()}`:''}<div class="notice">Ao concluir, a vistoria será salva neste aparelho e enviada ao servidor. As fotos anexadas serão enviadas junto com as respostas.</div>`}
function next(){if(step===0&&typeof checkTripBeforeStart==='function'){checkTripBeforeStart();return;}advanceStep();}
function advanceStep(){let error='';if(step===0){if(!inspectionState.name)error='Selecione seu nome na lista.';else if(tripMessage())error=tripMessage();else if(inspectionState.km.trim()==='')error='Informe a quilometragem atual.';else if(!Number.isSafeInteger(Number(inspectionState.km))||Number(inspectionState.km)<0)error='Informe a quilometragem em quilômetros inteiros, sem valor negativo.';}if(step===0&&!error)error=tripMessage();let qs=step>=1&&step<=3?groups[step-1][1]:refrigerated()&&step===4?[['frio']]:[];if(qs.some(q=>!answers[q[0]]))error='Responda todos os itens para continuar.';if(qs.some(q=>answers[q[0]]==='Problema'&&!(notes[q[0]]||'').trim()))error='Descreva o problema encontrado.';if(refrigerated()&&step===4&&(inspectionState.temp===''||!Number.isFinite(Number(inspectionState.temp))))error='Informe a temperatura indicada.';if(error){document.getElementById('message').textContent=error;return}if(step===stages().length-1){completeInspection();return}step++;render();window.scrollTo(0,0)}
function render(){document.getElementById('footer').hidden=false;let ss=stages();document.getElementById('app').innerHTML=`<div class="eyebrow">Checklist diário</div><h1>Vistoria do veículo</h1><p class="muted">Confira os itens e registre os problemas encontrados.</p><div class="layout"><aside class="card sidebar"><div class="eyebrow">Sua vistoria</div><ol class="steps">${ss.map((s,i)=>`<li class="${i===step?'current':i<step?'done':''}" ${i===step?'aria-current="step"':''}>${i<step?'✓':i+1} · ${s}</li>`).join('')}</ol><p class="muted">${step?esc(vehicles[inspectionState.vehicle]):'Saída: 6h–9h<br>Retorno: 15h–18h'}</p></aside><section class="card">${content()}<p id="message" role="alert"></p></section></div>`;document.getElementById('footer').innerHTML=`<div><button onclick="if(step>0){step--;render();window.scrollTo(0,0)}" ${step===0?'disabled':''}>← Voltar</button><span>Etapa ${step+1} de ${ss.length}</span><button class="primary" onclick="next()">${step===ss.length-1?'Concluir vistoria':'Continuar →'}</button></div>`}
render();
</script><script src="outbox.js"></script><script src="driver.js"></script></body></html>
