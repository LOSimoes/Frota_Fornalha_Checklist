<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fornalha · Prévia no celular</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;color:#2E120A;background:#FFFDF8}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 16px;padding:10px 12px;background:white;border-bottom:1px solid #ccd8cd;font-size:13px}
.toolbar strong{font-size:14px}.toolbar label{display:flex;align-items:center;gap:8px}select{font:inherit;padding:8px;border:1px solid #b1c2b4;border-radius:8px;background:white;min-height:40px}a{color:#82110E}select:focus-visible,a:focus-visible{outline:3px solid #c48024;outline-offset:2px}
main{flex:1;min-height:0;display:flex;justify-content:center;padding:12px}
.device{width:400px;max-width:100%;height:100%;min-height:0;overflow:hidden;border:5px solid #82110E;border-radius:22px;background:#FFF1C8;box-shadow:0 6px 24px #15321f20}
iframe{display:block;width:100%;height:100%;border:0}
.hint{flex:none;margin:0;text-align:center;padding:0 10px 8px;font-size:11px;color:#566b5c}
@media(max-width:480px){.toolbar{gap:6px 10px;padding:6px 8px}.toolbar strong{display:none}.toolbar label{font-size:12px}select{padding:6px}.toolbar a{font-size:12px}main{padding:0}.device{border:0;border-radius:0;max-width:100%}.hint{display:none}}
</style></head>
<body>
<header class="toolbar"><strong>Prévia no celular</strong><label for="size">Largura <select id="size" onchange="resizePreview(this.value)"><option value="390">Médio · 390 px</option><option value="360">Compacto · 360 px</option><option value="412">Grande · 412 px</option></select></label><a href="index.html" target="_blank" rel="noopener">Abrir em tela inteira ↗</a></header>
<main><section class="device" id="device" aria-label="Prévia do celular"><iframe src="index.html" title="Checklist da frota em tamanho de celular"></iframe></section></main>
<p class="hint">Altura ajustada à janela · Role somente o aplicativo · Abra pelo servidor para enviar</p>
<script>
function resizePreview(value){const device=document.getElementById('device');const border=parseFloat(getComputedStyle(device).borderLeftWidth)||0;device.style.width=(Number(value)+border*2)+'px';}
window.addEventListener('resize',()=>resizePreview(document.getElementById('size').value));
resizePreview(document.getElementById('size').value);
</script>
</body></html>
